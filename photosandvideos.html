<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photos & Videos | Glitched Out</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=Dongle&family=Special+Elite&family=Yesteryear&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/photosandvideos.css">
    <script src="JS/site.js" defer></script>
</head>

<body data-page="photos" data-base="">
    <div data-site-header></div>

    <main>
        <section class="media-page">
            <section class="media-section">
                <h1 class="media-section-title">Photos</h1>

                <div class="carousel media-carousel">
                    <button class="carousel-arrow carousel-arrow-left" type="button" aria-label="Scroll photos left" data-carousel-prev>&#10094;</button>
                    <div class="carousel-track media-track" data-photo-albums></div>
                    <button class="carousel-arrow carousel-arrow-right" type="button" aria-label="Scroll photos right" data-carousel-next>&#10095;</button>
                </div>
            </section>

            <section class="media-section">
                <h2 class="media-section-title">Videos</h2>

                <div class="carousel media-carousel">
                    <button class="carousel-arrow carousel-arrow-left" type="button" aria-label="Scroll videos left" data-carousel-prev>&#10094;</button>
                    <div class="carousel-track media-track" data-videos></div>
                    <button class="carousel-arrow carousel-arrow-right" type="button" aria-label="Scroll videos right" data-carousel-next>&#10095;</button>
                </div>
            </section>
        </section>
    </main>

    <div data-site-footer></div>
</body>

</html>
