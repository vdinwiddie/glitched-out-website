<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glitched Out</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Site Header -->
    <header class="site-header">

        <div class="header-left">
            <a href="index.html" class="logo">
                <img src="Images/HomePage/Header/logo.svg" alt="Glitched Out">
            </a>
        </div>

        <div class="header-center">
            <nav class="main-nav">
                <a href="#">Discography</a>
                <a href="#">Shows</a>
                <a href="#">Photos & Videos</a>
                <a href="#">About Us</a>
            </nav>
        </div>

        <div class="header-right">

            <div class="social-links">
                <a href="https://www.instagram.com/glitched_out_chicago/">
                    <img src="Images/HomePage/Header/ig.svg" alt="Instagram">
                </a>

                <a href="https://www.facebook.com/glitchedoutchicago/">
                    <img src="Images/HomePage/Header/fb.svg" alt="Facebook">
                </a>

                <a href="https://open.spotify.com/artist/1mYSl7MkjKWYck7fI6GbTd?si=UxX4x3pMTj-hhR8BFOrp0A">
                    <img src="Images/HomePage/Header/sp.svg" alt="Spotify">
                </a>

                <a href="https://music.youtube.com/channel/UC3-S2ekIVpy3KFDjjneu7nQ?si=ELe-DXlDLmwOdExn">
                    <img src="Images/HomePage/Header/yt.svg" alt="YouTube Music">
                </a>

                <a href="https://music.apple.com/us/artist/glitched-out/1728156264">
                    <img src="Images/HomePage/Header/am.svg" alt="Apple Music">
                </a>

                <a href="https://link.deezer.com/s/34d7XraWxYM3XHabTfGpq">
                    <img src="Images/HomePage/Header/dz.svg" alt="Deezer">
                </a>
            </div>

            <a href="#" class="button button-red">SHOP</a>

        </div>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Latest Release -->
        <section class="latest-release">

            <div class="release-artwork">
                <img src="Images/HomePage/LatestRelease/album_cover.jpg" alt="Latest Release">
            </div>

            <div class="release-info">

                <div class="release-heading">
                    <h1 class="release-title">
                        The Physical Properties of Standing Still
                    </h1>

                    <p class="release-date">
                        Out August 16, 2026
                    </p>
                </div>

                <div class="listen-section">
                    <h2>Listen now on...</h2>

                    <div class="streaming-links">
                        <a class="button button-blue" href="https://open.spotify.com/artist/1mYSl7MkjKWYck7fI6GbTd?si=UxX4x3pMTj-hhR8BFOrp0A">
                            SPOTIFY
                        </a>

                        <a class="button button-blue" href="https://music.youtube.com/channel/UC3-S2ekIVpy3KFDjjneu7nQ?si=ELe-DXlDLmwOdExn">
                            YOUTUBE MUSIC
                        </a>

                        <a class="button button-blue" href="https://music.apple.com/us/artist/glitched-out/1728156264">
                            APPLE MUSIC
                        </a>

                        <a class="button button-blue" href="https://link.deezer.com/s/34d7XraWxYM3XHabTfGpq">
                            DEEZER
                        </a>
                    </div>
                </div>

                <a class="button button-red button-discography" href="#">
                    Check out our discography!
                </a>

            </div>

        </section>

        <!-- Merch -->
         <section class="merch-section">

            <h2 class="merch-title">Merch</h2>

            <img class="merch-preview" src="Images/HomePage/Merch/merchbanner.jpg" alt="Merch preview">

            <a class="button button-red button-merch" href="#">Check out our merch!</a>

         </section>
    </main>

</body>
</html>
